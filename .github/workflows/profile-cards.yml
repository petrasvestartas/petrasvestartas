name: Profile cards

# Redraws assets/*.svg from live GitHub data so the README never shows a stale
# graph. Rendering happens here rather than through a third-party card service,
# which is the point: those go down, and the profile shows a broken image.

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render cards
        env:
          # Swap for a personal access token if the default token ever stops
          # resolving the contribution calendar.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_USER: petrasvestartas
        run: python scripts/generate_cards.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Refresh profile cards"
          git push
